<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" ry="12"/>
    
    <!-- Animated background elements (DNA like waves) -->
    <g transform="translate(0, 80)">
        <path d="M0,20 C100,-20 200,60 300,20 C400,-20 500,60 600,20 C700,-20 800,60 900,20" fill="none" stroke="#4facfe" stroke-width="3" opacity="0.4">
            <animate attributeName="d" values="M0,20 C100,-20 200,60 300,20 C400,-20 500,60 600,20 C700,-20 800,60 900,20; M0,20 C100,60 200,-20 300,20 C400,60 500,-20 600,20 C700,60 800,-20 900,20; M0,20 C100,-20 200,60 300,20 C400,-20 500,60 600,20 C700,-20 800,60 900,20" dur="4s" repeatCount="indefinite" />
        </path>
        <path d="M0,20 C100,60 200,-20 300,20 C400,60 500,-20 600,20 C700,60 800,-20 900,20" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.4">
            <animate attributeName="d" values="M0,20 C100,60 200,-20 300,20 C400,60 500,-20 600,20 C700,60 800,-20 900,20; M0,20 C100,-20 200,60 300,20 C400,-20 500,60 600,20 C700,-20 800,60 900,20; M0,20 C100,60 200,-20 300,20 C400,60 500,-20 600,20 C700,60 800,-20 900,20" dur="4s" repeatCount="indefinite" />
        </path>
    </g>
    
    <g transform="translate(0, 120)">
        <path d="M-100,20 C0,-20 100,60 200,20 C300,-20 400,60 500,20 C600,-20 700,60 800,20 C900,-20 1000,60 1100,20" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.2">
            <animate attributeName="d" values="M-100,20 C0,-20 100,60 200,20 C300,-20 400,60 500,20 C600,-20 700,60 800,20 C900,-20 1000,60 1100,20; M-100,20 C0,60 100,-20 200,20 C300,60 400,-20 500,20 C600,60 700,-20 800,20 C900,60 1000,-20 1100,20; M-100,20 C0,-20 100,60 200,20 C300,-20 400,60 500,20 C600,-20 700,60 800,20 C900,-20 1000,60 1100,20" dur="6s" repeatCount="indefinite" />
        </path>
    </g>

    <!-- Main Text -->
    <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="46" fill="url(#textGrad)">
        Bioinformatician
    </text>
    <text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#e2e8f0" letter-spacing="2">
        INTERVIEW QUESTIONS
    </text>
</svg>
